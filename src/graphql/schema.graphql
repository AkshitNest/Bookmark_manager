type Folder {
  id: ID!
  name: String!
  createdAt: String!
  bookmarks: [Bookmark!]!
}

type Bookmark {
  id: ID!
  title: String!
  url: String!
  tags: [String!]!
  folderId: ID!
  createdAt: String!
}

type Query {
  folders: [Folder!]!
  folder(id: ID!): Folder
  bookmarks(
    folderId: ID
    search: String
    take: Int
    cursor: ID
  ): BookmarkConnection!
}

type BookmarkConnection {
  items: [Bookmark!]!
  nextCursor: ID
}